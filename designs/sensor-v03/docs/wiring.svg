<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740">
<rect width="1100" height="740" fill="#10121c"/><style>text{font:16px sans-serif;fill:#ecebf7}.title{font-size:27px;font-weight:bold}.small{font-size:13px;fill:#c3bfd4}rect.node{fill:#242337;stroke:#ae8bdf;stroke-width:1.5}path{fill:none;stroke:#9fc9eb;stroke-width:2}.pwr{stroke:#e3b875}.data{stroke:#b396e0}</style>
<text x="40" y="45" class="title">Sweetybot2 v03 · proposed wiring</text><text x="40" y="72" class="small">Common ground; separate motor power branches. CAD + offline checks; drivers and hardware validation pending.</text>
<rect class="node" x="40" y="115" width="200" height="85" rx="12"/><text x="60" y="148">3S LiFePO4 battery</text><text x="60" y="175" class="small">main switch / fuse / E-stop</text>
<rect class="node" x="340" y="110" width="210" height="90" rx="12"/><text x="360" y="145">14 × STS3250</text><text x="360" y="175" class="small">legs + yaw / pitch</text>
<rect class="node" x="340" y="235" width="210" height="85" rx="12"/><text x="360" y="267">D30V30F6 → 6V</text><text x="360" y="296" class="small">validate load / temperature</text>
<rect class="node" x="690" y="235" width="230" height="85" rx="12"/><text x="710" y="267">2 × STS3032 ears</text><text x="710" y="296" class="small">6V only; separate power</text>
<rect class="node" x="40" y="350" width="200" height="75" rx="12"/><text x="60" y="381">Logic 5V regulator</text><text x="60" y="405" class="small">combined load test required</text>
<rect class="node" x="340" y="365" width="210" height="90" rx="12"/><text x="360" y="400">Raspberry Pi Zero 2 W</text><text x="360" y="430" class="small">Bluetooth joystick retained</text>
<rect class="node" x="690" y="350" width="370" height="90" rx="12"/><text x="710" y="383">CSI → Camera Module 3 Wide</text><text x="710" y="414">SPI → 2 round eye LCDs</text>
<rect class="node" x="690" y="485" width="370" height="85" rx="12"/><text x="710" y="518">I2C → chest VL53L5CX</text><text x="710" y="547" class="small">dedicated 3V3 buck; do not parallel Pi 3V3</text>
<rect class="node" x="340" y="565" width="210" height="90" rx="12"/><text x="360" y="600">XIAO RP2040</text><text x="360" y="630" class="small">3.3V UART to Pi</text>
<rect class="node" x="40" y="545" width="215" height="110" rx="12"/><text x="60" y="578">4 hoof contacts</text><text x="60" y="608" class="small">4 ADC resistor-coded loops</text><text x="60" y="632" class="small">EOL at hoof; 10ms debounce</text>
<rect class="node" x="690" y="615" width="370" height="65" rx="12"/><text x="710" y="650">I2C → rigid torso LSM6DSV16X</text>
<path class="pwr" d="M240 155H340 M280 155V277H340 M140 200V350 M550 277H690 M240 388H340 M240 410H280V645H340"/><path class="data" d="M550 400H690 M550 425H620V525H690 M445 455V565 M550 610H620V647H690 M255 600H340"/>
<path class="data" d="M390 365V340H305V155H340 M305 340H650V305H690"/>
<text x="56" y="705" class="small">TTL data may share a compatible bus; power must not bridge the 6V and main-servo rails. Verify exact module pinouts before wiring.</text>
</svg>
