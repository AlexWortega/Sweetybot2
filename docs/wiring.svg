<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440"><style>text{font-family:Arial,sans-serif;fill:#17223b;font-size:18px}.b{fill:#eeeaf8;stroke:#706191;stroke-width:2}.w{stroke:#706191;stroke-width:3;fill:none}</style><rect width="1100" height="440" fill="white"/><text x="35" y="40" style="font-size:28px">Sweetybot2 v04 — power and signal architecture</text><rect class="b" x="35" y="75" width="270" height="80" rx="8"/><text x="50" y="104">3S LiFePO4 9.3..10.8V</text><text x="50" y="133">DC disconnect + 40A fuse</text><rect class="b" x="365" y="75" width="300" height="80" rx="8"/><text x="380" y="104">Motor disconnect / distribution</text><text x="380" y="133">4×10A legs / 5A head</text><rect class="b" x="725" y="75" width="335" height="80" rx="8"/><text x="740" y="104">12 SM legs + 2 STS neck</text><text x="740" y="133">Separate 6V buck → 2 ears</text><path class="w" d="M305 115H365 M665 115H725"/><rect class="b" x="35" y="220" width="270" height="100" rx="8"/><text x="50" y="250">5A logic / 5V regulator</text><text x="50" y="279">Pi + hub + RP2040 collector</text><text x="50" y="305">IMU / contacts / CSI camera</text><rect class="b" x="365" y="220" width="300" height="100" rx="8"/><text x="380" y="250">USB RS485 → 12 SM legs</text><text x="380" y="279">USB TTL → neck + ears</text><text x="380" y="305">Signal buses remain separate</text><rect class="b" x="725" y="220" width="335" height="100" rx="8"/><text x="740" y="250">Dedicated 3V3 → chest ToF</text><text x="740" y="279">SPI → 2 round GC9A01 LCDs</text><text x="740" y="305">UART → collector telemetry</text><path class="w" d="M170 155V220 M305 265H365 M665 265H725"/><text x="35" y="365">Common reference ground. Never join 6V and battery positive, or TTL and RS485 signals.</text><text x="35" y="398">Planning specification: fuse coordination, voltage sag, bus drivers and thermal endurance need bench validation.</text></svg>